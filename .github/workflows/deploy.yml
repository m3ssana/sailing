# Deploy to GitHub Pages on push to main/master.
#
# Served from the custom domain sailing.messana.ai (see the CNAME step below),
# so the Vite build uses the root base path, not the /<repo-name>/ subpath
# GitHub's default *.github.io URL would need.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          DEPLOY_BASE: '/'

      - name: Add custom domain CNAME
        run: echo 'sailing.messana.ai' > dist/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
